name: Apply v5 patch
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply asserted v5 patch
        run: python3 tools/apply_v5.py
      - name: Remove the one-shot patch script
        run: git rm -q tools/apply_v5.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js index.html detail.html
          git commit -m "v5 (4/4): wire protected photos, View more, v5.css on home and detail pages (patched from tested files, SHA-verified)"
          git push origin master
      - name: Trigger the Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref master
